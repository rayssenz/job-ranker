<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% if count is not none %}{{ count }} {% endif %}{{ words }} | Job Ranker</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/dashboard.css">
<script src="/static/dashboard.js" defer></script>
</head>
<body>
<header class="top">
  <div class="lead">
    <h1>{% if count is not none %}<b class="badge">{{ count }}</b> {% endif %}{{ words }}</h1>
    {% block lead %}{% endblock %}
  </div>
  <nav class="tabs" aria-label="Lists">
    {% for tab in tabs -%}
    <a class="tab" href="{{ tab.path }}"{% if tab.path == active %} aria-current="page"{% endif %}>{{ tab.label }}{% if tab.count is not none %} <span class="count">{{ tab.count }}</span>{% endif %}</a>
    {% endfor %}
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
